name: 🎨 CI Frontend — Lint Twig & Assets

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - "templates/**"
      - "assets/**"
      - "translations/**"
      - "importmap.php"
      - "public/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - "templates/**"
      - "assets/**"
      - "translations/**"
      - "importmap.php"
      - "public/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint:
    name: 🧹 Lint Twig & Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:twig templates
      - name: Vérifie que l'AssetMapper compile sans erreur
        run: php bin/console asset-map:compile