name: 🔧 CI Backend — Lint & Tests PHP

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - "src/**"
      - "config/**"
      - "migrations/**"
      - "tests/**"
      - "bin/**"
      - "composer.json"
      - "composer.lock"
      - "phpstan*.neon*"
      - "phpunit.dist.xml"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - "src/**"
      - "config/**"
      - "migrations/**"
      - "tests/**"
      - "bin/**"
      - "composer.json"
      - "composer.lock"
      - "phpstan*.neon*"
      - "phpunit.dist.xml"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint:
    name: 🧹 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
      - run: php bin/console lint:yaml config
      - run: php bin/console lint:container
      - run: composer audit

  tests:
    name: 🧪 Tests PHPUnit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cesizen_test?serverVersion=8.0&charset=utf8mb4"
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cesizen_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: xdebug
      - run: composer install --no-interaction --no-progress
      - name: Setup test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:fixtures:load --env=test --no-interaction
      - run: vendor/bin/phpunit --coverage-clover coverage.xml
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml