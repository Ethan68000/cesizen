name: cesizen-staging
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: staging
        APP_VERSION: ${APP_VERSION:-staging}
    environment:
      APP_ENV: staging
      APP_DEBUG: 1
      DATABASE_URL: ${DATABASE_URL:-mysql://app:secret@db:3306/cesizen_staging}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [ backend ]
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [ app ]
    networks: [ backend ]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cesizen_staging
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - db_data_staging:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]
    restart: unless-stopped

volumes:
  db_data_staging:

networks:
  backend:
    driver: bridge